<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERM4AI — Associative Knowledge Network</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-color: #f3f4f6;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-purple: #c084fc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { padding: 16px 24px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: var(--accent-blue); }
        .header p { font-size: 13px; color: #9ca3af; margin-top: 4px; }
        .stats-badge { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        #networkContainer { flex: 1; position: relative; width: 100%; height: calc(100vh - 80px); cursor: grab; }
        svg { width: 100%; height: 100%; }
        .node circle { fill: #1e293b; stroke: var(--accent-blue); stroke-width: 2.5px; cursor: pointer; transition: all 0.2s; }
        .node:hover circle { fill: #38bdf8; stroke: #fff; }
        .node text { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; pointer-events: none; }
        .link { stroke: #475569; stroke-opacity: 0.8; stroke-dasharray: 4; }
        .link-label { fill: #94a3b8; font-size: 10px; font-family: monospace; text-anchor: middle; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>HERM4AI — Associative Knowledge Graph</h1>
            <p>Interactive visualization of relational connections, semantic associations, and spreading activation pathways.</p>
        </div>
        <div class="stats-badge">
            Nodes: <strong style="color: var(--accent-green);" id="nodeCount">12</strong> | 
            Edges: <strong style="color: var(--accent-purple);" id="edgeCount">10</strong>
        </div>
    </div>
    <div id="networkContainer">
        <svg id="networkSvg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                </marker>
            </defs>
            <g id="zoomGroup"></g>
        </svg>
    </div>

    <script>
        const data = {"nodes": [{"id": "Dr. Aris Thorne", "label": "Dr. Aris Thorne"}, {"id": "Database-Cluster-9", "label": "Database-Cluster-9"}, {"id": "Neural-Core", "label": "Neural-Core"}, {"id": "Device_Telemetry", "label": "Device_Telemetry"}, {"id": "Server-Alpha", "label": "Server-Alpha"}, {"id": "Quantum-Lab-Subnet", "label": "Quantum-Lab-Subnet"}, {"id": "Sora Takahashi", "label": "Sora Takahashi"}, {"id": "Dr. Elena Rostova", "label": "Dr. Elena Rostova"}, {"id": "Auth-Service-V2", "label": "Auth-Service-V2"}, {"id": "Core-Router-B", "label": "Core-Router-B"}, {"id": "Project-Vanguard", "label": "Project-Vanguard"}, {"id": "Marcus Vance", "label": "Marcus Vance"}], "edges": [{"source": "Dr. Aris Thorne", "target": "Project-Vanguard", "relation": "LEADS", "weight": 1.0}, {"source": "Project-Vanguard", "target": "Quantum-Lab-Subnet", "relation": "DEPLOYED_ON", "weight": 0.9}, {"source": "Quantum-Lab-Subnet", "target": "Core-Router-B", "relation": "DEPENDS_ON", "weight": 0.8}, {"source": "Core-Router-B", "target": "Device_Telemetry", "relation": "MONITORED_BY", "weight": 0.7}, {"source": "Marcus Vance", "target": "Auth-Service-V2", "relation": "AUDITS", "weight": 1.0}, {"source": "Auth-Service-V2", "target": "Database-Cluster-9", "relation": "SECURES", "weight": 0.9}, {"source": "Database-Cluster-9", "target": "Server-Alpha", "relation": "HOSTED_ON", "weight": 0.85}, {"source": "Dr. Elena Rostova", "target": "Dr. Aris Thorne", "relation": "COORDINATES_WITH", "weight": 0.75}, {"source": "Sora Takahashi", "target": "Neural-Core", "relation": "ARCHITECTS", "weight": 1.0}, {"source": "Neural-Core", "target": "Project-Vanguard", "relation": "INTEGRATES_WITH", "weight": 0.8}]};
        const svg = document.getElementById("networkSvg");
        const zoomGroup = document.getElementById("zoomGroup");

        const width = window.innerWidth;
        const height = window.innerHeight - 80;

        // Position nodes in a clean circular layout
        const N = data.nodes.length;
        const radius = Math.min(width, height) * 0.35;
        const centerX = width / 2;
        const centerY = height / 2;

        const nodePos = {};
        data.nodes.forEach((node, idx) => {
            const angle = (idx / (N || 1)) * 2 * Math.PI;
            nodePos[node.id] = {
                x: centerX + radius * Math.cos(angle),
                y: centerY + radius * Math.sin(angle)
            };
        });

        // Render Edges
        data.edges.forEach(edge => {
            const p1 = nodePos[edge.source] || { x: centerX, y: centerY };
            const p2 = nodePos[edge.target] || { x: centerX, y: centerY };

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", p1.x);
            line.setAttribute("y1", p1.y);
            line.setAttribute("x2", p2.x);
            line.setAttribute("y2", p2.y);
            line.setAttribute("class", "link");
            line.setAttribute("stroke-width", Math.max(1.5, edge.weight * 2.5));
            line.setAttribute("marker-end", "url(#arrow)");
            zoomGroup.appendChild(line);

            // Edge label
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", (p1.x + p2.x) / 2);
            text.setAttribute("y", (p1.y + p2.y) / 2 - 5);
            text.setAttribute("class", "link-label");
            text.textContent = edge.relation + " (" + edge.weight + ")";
            zoomGroup.appendChild(text);
        });

        // Render Nodes
        data.nodes.forEach(node => {
            const pos = nodePos[node.id];
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "node");
            g.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", "16");
            g.appendChild(circle);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("y", "26");
            text.textContent = node.label;
            g.appendChild(text);

            zoomGroup.appendChild(g);
        });
    </script>
</body>
</html>
